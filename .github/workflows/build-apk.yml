name: Build CallShare P2P APK (Cloud Auto-Builder)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Rust NDK & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 ndk;25.2.9519653'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust Targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust Native Core with cargo-ndk
        run: |
          cd rust-core
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android-app/app/src/main/jniLibs build --release

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: |
          cd android-app
          gradle assembleDebug --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallShare-P2P-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
